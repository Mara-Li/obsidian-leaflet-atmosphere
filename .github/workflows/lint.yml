name: Lint

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
              with:
               version: 12
               cache: true              
            - uses: actions/setup-node@v6
              with:
                  node-version: 26
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: pnpm run lint
